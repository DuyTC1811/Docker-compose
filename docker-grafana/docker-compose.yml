name: observability

services:
  # ---------- App ----------
  observability:
    build: ..
    image: observability:dev
    ports:
      - "8080:8080"                             # chỉ public API
      - "127.0.0.1:8081:8081"                   # actuator: chỉ localhost (để curl debug)
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_ENV: dev
      OTEL_SERVICE_NAME: observability          # OBI dùng làm service.name
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_FILE_NAME: ""
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    labels:
      logging: alloy                            # Alloy thu stdout
      app: observability                        # -> service_name trong Loki
    mem_limit: 1g
    restart: unless-stopped

  # ---------- LGTM ----------
  init:
    image: busybox:1.37
    user: root
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /var/tempo /loki"]
    volumes:
      - tempo-data:/var/tempo
      - loki-data:/loki
    restart: "no"

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # chỉ cho local
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro   # nếu dùng dashboard provisioning
      - grafana-data:/var/lib/grafana
    depends_on: [mimir, loki, tempo]

  mimir:
    image: grafana/mimir:2.17.0
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir.yaml:ro
      - mimir-data:/data
    ports: ["9009:9009"]

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki                         # local-config.yaml mặc định lưu ở /loki
    ports: ["3100:3100"]
    depends_on:
      init: { condition: service_completed_successfully }

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
    depends_on:
      init: { condition: service_completed_successfully }

  # ---------- Collector ----------
  alloy:
    image: grafana/alloy:v1.10.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # scrape OBI :9400 trên host
    ports:
      - "12345:12345"
      - "4318:4318"                                      # OTLP từ OBI
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [mimir, loki, tempo]

  # ---------- eBPF instrumentation ----------
  obi:
    image: otel/ebpf-instrument:v0.15.2
    pid: host
    privileged: true
    network_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /sys/fs/bpf:/sys/fs/bpf
      - ./obi/obi-config.yml:/config/obi-config.yml:ro
    environment:
      OTEL_EBPF_CONFIG_PATH: /config/obi-config.yml
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:4318/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EBPF_PROMETHEUS_PORT: 9400
      OTEL_EBPF_METRICS_FEATURES: application,application_service_graph
      # OTEL_EBPF_TRACE_PRINTER: text           # bật khi debug
    depends_on: [alloy]                         # OBI tự phát hiện process, không cần chờ app

volumes:
  grafana-data:
  mimir-data:
  loki-data:
  tempo-data:
  alloy-data: