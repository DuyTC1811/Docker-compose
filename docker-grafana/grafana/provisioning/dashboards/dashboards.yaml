apiVersion: 1

providers:
  - name: default
    folder: Spring Boot
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      # Thả thêm file JSON (ví dụ export từ grafana.com: 4701 JVM, 12900 Spring Boot APM) vào đây
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
