# OpenTelemetry eBPF Instrumentation (OBI)
# Tự bắt HTTP/gRPC/SQL ở tầng kernel, không cần sửa code.

discovery:
  instrument:
    # Phải khớp CẢ HAI: java + listen 8080
    # Lưu ý: instrument cả process => 8081 (actuator) cũng bị bắt, lọc ở routes
    - open_ports: 8080
      exe_path: "*java*"
      name: observability
  # Spring app đã gửi OTLP qua Micrometer? false = OBI vẫn instrument
  exclude_otel_instrumented_services: false

routes:
  unmatched: heuristic # fallback cho route chưa khai báo
  patterns:
    - /internal/*
  # Bỏ span/metrics của scrape actuator & health check
  ignored_patterns:
    - /actuator/*

attributes:
  kubernetes:
    enable: false

metrics:
  features:
    - application
    - application_service_graph

prometheus_export:
  port: 9400
  path: /metrics

# OBI chạy network host -> Alloy publish 4317 ra host
otel_traces_export:
  endpoint: http://localhost:4317