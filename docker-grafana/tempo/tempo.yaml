# Tempo 3.x monolithic (target: all), lưu local. CHỈ cho dev.
# Không cần Kafka ở chế độ monolithic.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Thay cho ingester (đã bị xoá ở 3.0): live-store giữ trace gần đây + flush block
live_store:
  wal:
    path: /var/tempo/live-store/traces

# Sinh metric từ trace (RED metrics + service graph) rồi đẩy sang Mimir
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    # Thay cho compactor.compaction.block_retention
    compaction:
      block_retention: 72h            # giữ trace 3 ngày
    metrics_generator:
      # Bỏ local-blocks: 3.0 do live-store đảm nhiệm
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false